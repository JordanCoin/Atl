openapi: 3.1.0
info:
  title: ATL - iOS Browser Automation API
  description: |
    iOS Safari automation via HTTP. Simple pattern: goto → markAll → clickMark.

    ## Quick Start
    ```bash
    ./bin/atl start
    curl http://localhost:9222/ping
    ```

    ## Security Warning

    This API runs an **unauthenticated HTTP server** for local development only.

    - Server binds to 127.0.0.1 (localhost) and rejects external connections
    - Never expose port 9222 to the network or internet
    - Treat this like a browser debug port - it has full control over the WebView
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:9222
    description: Local iOS Simulator (localhost only)

paths:
  /ping:
    get:
      summary: Health check
      operationId: ping
      responses:
        '200':
          description: Server is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
              example:
                status: ok

  /command:
    post:
      summary: Execute browser command
      operationId: executeCommand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Command'
      responses:
        '200':
          description: Command executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

components:
  schemas:
    Command:
      type: object
      required: [id, method]
      properties:
        id:
          type: string
          description: Unique request identifier
        method:
          type: string
          enum:
            # Navigation
            - goto
            - reload
            - goBack
            - goForward
            - getURL
            - getTitle
            # Set-of-Mark (main feature)
            - markAll
            - markElements
            - clickMark
            - getMarkInfo
            - unmarkElements
            # Touch Gestures
            - tap
            - longPress
            - swipe
            - pinch
            # Interaction
            - click
            - doubleClick
            - fill
            - type
            - press
            - hover
            - scrollIntoView
            # Capture
            - screenshot
            - captureForVision
            - captureLight
            - captureJPEG
            # Query
            - querySelector
            - querySelectorAll
            - evaluate
            - getDOMSnapshot
            # Waiting
            - waitForSelector
            - waitForReady
            - waitForNavigation
            - waitForAny
            # Cookies
            - getCookies
            - setCookies
            - deleteCookies
        params:
          type: object
          description: Method-specific parameters

    Response:
      type: object
      properties:
        id:
          type: string
        success:
          type: boolean
        result:
          type: object
        error:
          type: string

    # Navigation
    GotoParams:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          example: https://amazon.com

    # Interaction
    ClickParams:
      type: object
      required: [selector]
      properties:
        selector:
          type: string
          description: CSS selector
          example: "#add-to-cart"

    FillParams:
      type: object
      required: [selector, value]
      properties:
        selector:
          type: string
          example: "input[name=q]"
        value:
          type: string
          example: "airpods pro"

    TypeParams:
      type: object
      required: [text]
      properties:
        text:
          type: string

    PressParams:
      type: object
      required: [key]
      properties:
        key:
          type: string
          enum: [Enter, Tab, Escape, Backspace, ArrowUp, ArrowDown, ArrowLeft, ArrowRight]

    # Touch Gestures
    TapParams:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
          description: X coordinate in viewport
        y:
          type: number
          description: Y coordinate in viewport

    LongPressParams:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
        y:
          type: number
        duration:
          type: number
          default: 0.5
          description: Duration in seconds

    SwipeParams:
      type: object
      properties:
        direction:
          type: string
          enum: [up, down, left, right]
          description: Swipe direction (use this OR from/to coordinates)
        distance:
          type: number
          default: 300
          description: Swipe distance in pixels
        fromX:
          type: number
        fromY:
          type: number
        toX:
          type: number
        toY:
          type: number
        duration:
          type: number
          default: 0.3

    PinchParams:
      type: object
      properties:
        scale:
          type: number
          default: 1.5
          description: Scale factor (>1 zoom in, <1 zoom out)
        duration:
          type: number
          default: 0.3

    GetMarkInfoParams:
      type: object
      required: [label]
      properties:
        label:
          type: integer
          description: Mark label number from markAll/markElements

    GetMarkInfoResult:
      type: object
      properties:
        label:
          type: integer
        text:
          type: string
        tagName:
          type: string
        href:
          type: string
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number

    # Waiting
    WaitForReadyParams:
      type: object
      properties:
        timeout:
          type: number
          default: 10
        stabilityMs:
          type: integer
          default: 500
        selector:
          type: string
          description: Optional selector that must exist

    EvaluateParams:
      type: object
      required: [script]
      properties:
        script:
          type: string
          description: JavaScript to execute in page context

    # Capture
    ScreenshotParams:
      type: object
      properties:
        fullPage:
          type: boolean
          default: false
          description: |
            - false: PNG of viewport
            - true: PDF of entire scrollable page (vector text, searchable)

    ScreenshotResult:
      type: object
      properties:
        data:
          type: string
          format: byte
          description: Base64-encoded PNG or PDF
        mimeType:
          type: string
          enum: [image/png, application/pdf]

    LightCaptureResult:
      type: object
      description: Structured page data (~99% smaller than PDF)
      properties:
        title:
          type: string
        url:
          type: string
          format: uri
        timestamp:
          type: string
          format: date-time
        text:
          type: string
          description: All visible text content
        interactives:
          type: array
          items:
            $ref: '#/components/schemas/InteractiveElement'

    InteractiveElement:
      type: object
      properties:
        tag:
          type: string
          example: A
        id:
          type: string
        text:
          type: string
        href:
          type: string
        ariaLabel:
          type: string

    # Query
    QuerySelectorParams:
      type: object
      required: [selector]
      properties:
        selector:
          type: string

    Element:
      type: object
      properties:
        tag:
          type: string
        id:
          type: string
        className:
          type: string
        text:
          type: string
        href:
          type: string
        value:
          type: string
        rect:
          type: object
          properties:
            x:
              type: number
            y:
              type: number
            width:
              type: number
            height:
              type: number

tags:
  - name: Navigation
    description: Page navigation commands
  - name: Marks
    description: Set-of-Mark labeling system - the core feature
  - name: Touch Gestures
    description: Tap, swipe, pinch at coordinates (vision-free)
  - name: Interaction
    description: Click, type, fill forms
  - name: Capture
    description: Screenshots, PDFs, structured data
  - name: Query
    description: Find elements, execute JavaScript
  - name: Waiting
    description: Wait for selectors, navigation, page ready
